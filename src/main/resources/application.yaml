spring:
  application:
    name: agentic-engineering-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic}
    username: ${DB_USERNAME:agentic}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      fail-on-null-for-primitives: true
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
springdoc:
  swagger-ui:
    path: /swagger-ui.html
agentic:
  instance-id: ${AGENTIC_INSTANCE_ID:local-worker}
  build:
    assets-root: ${AGENTIC_BUILD_ASSETS_ROOT:.}
    maven-repository: ${AGENTIC_MAVEN_REPOSITORY:}
    timeout-seconds: 180
  operator:
    token: ${AGENTIC_OPERATOR_TOKEN:}
  processing:
    enabled: true
    poll-ms: 500
  repositories:
    root: ${AGENTIC_REPOSITORY_ROOT:./scenario-repositories}
    max-files: 2000
    max-file-bytes: 262144
    max-total-bytes: 10485760
  workspaces:
    root: ${AGENTIC_WORKSPACE_ROOT:./agent-workspaces}
