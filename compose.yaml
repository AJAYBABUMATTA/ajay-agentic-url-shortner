services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  platform-db:
